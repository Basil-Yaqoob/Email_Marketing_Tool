[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-marketing-tool"
version = "0.1.0"
description = "Self-hosted, local-first cold email platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "arq>=0.26",
    "redis>=5.2",
    "structlog>=24.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "cryptography>=44.0",
    "playwright>=1.49",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real external services; excluded by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic regenerates versions/ from the models on every `revision
# --autogenerate` — it is generated code, not hand-maintained, and
# reformatting it on every migration would make diffs unreadable.
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
# BLE001 = blind except. This project bans it; see CLAUDE.md rule 2.1.
extend-select = ["BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/versions"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
